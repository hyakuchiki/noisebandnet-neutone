# @package _global_

defaults:
  - data: default.yaml
  - ae: noiseband.yaml
  - loss: spec.yaml
  - trainer: default.yaml
  - _self_

name: null
sample_rate: 48000
batch_size: 8
seed: 0
num_workers: 8
ckpt: null # Used for resuming from checkpoint
xfer_dir: assets
save_last: true

trainer:
  check_val_every_n_epoch: 10
  # Max iterations
  max_steps: 20000

# Output directory
hydra:
  job:
    chdir: true
    config:
      override_dirname:
        kv_sep: "-"
        item_sep: "_"
  run:
    dir: logs/${name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: logs/${name}/multirun_${now:%Y-%m-%d_%H-%M-%S}
    # subdir: ${hydra.job.override_dirname}
    subdir: ${hydra.job.num}
